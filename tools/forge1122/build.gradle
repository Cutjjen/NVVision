buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net/' }; mavenCentral() }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:3.+' }
}
def canonical = file('../..')
def targets = new groovy.json.JsonSlurper().parse(new File(canonical, 'config/versions.json'))
def target = targets.find { it.key == 'forge-1122' }
subprojects {
    apply plugin: 'net.minecraftforge.gradle'
    apply plugin: 'java'
    group = 'dev.cutjjen.nvvision'
    version = target[name]
    sourceCompatibility = targetCompatibility = '1.8'
    minecraft { mappings channel: 'snapshot', version: '20171003-1.12' }
    dependencies { minecraft "net.minecraftforge:forge:${target.dependencies.platform}" }
    sourceSets {
        main {
            java.srcDirs = [new File(canonical, "source/adapters/forge-1122/${project.name}/main/java")]
            resources.srcDirs = [new File(canonical, "source/adapters/forge-1122/${project.name}/main/resources")]
        }
        test { java.srcDirs = [new File(canonical, "source/adapters/forge-1122/${project.name}/test/java")] }
    }
    tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
    jar {
        archiveName = "${project.name == 'mod' ? 'NVVisionBoost' : 'NVVisionAddon'}-${version}-MC-Forge-1.12.2.jar"
        preserveFileTimestamps = false
        reproducibleFileOrder = true
        manifest.attributes('Implementation-Vendor': 'Cutjjen', 'Implementation-Version': project.version)
    }
    jar.finalizedBy('reobfJar')
    task legacyRegression(type: JavaExec, dependsOn: testClasses) {
        classpath = sourceSets.test.runtimeClasspath
        main = project.name == 'mod' ? 'nvvisionboost.legacy.LegacyConfigTest' : 'nvvisionboost.legacy.addon.LegacyLeaseTest'
        args new File(buildDir, 'regression').absolutePath
    }
    check.dependsOn(legacyRegression)
}
project(':addon') { dependencies { compile project(':mod') } }
