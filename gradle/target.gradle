// One selected platform per artifact. Shared code stays independent of loader lifecycle.
def variants = new groovy.json.JsonSlurper().parse(rootProject.file('config/versions.json'))
def kind = project.name.endsWith('-addon') ? 'addon' : 'mod'
def key = project.name.substring(0, project.name.length() - kind.length() - 1)
def target = variants.find { it.key == key }
if (!target) throw new GradleException("Unregistered target ${key}")
def entries = new groovy.json.JsonSlurper().parse(rootProject.file('config/sources.json')).findAll { it.target == key && it.kind == kind }
group = 'dev.cutjjen.nvvision'
version = target[kind]
def componentLabel = kind == 'mod' ? 'NVVisionBoost' : 'NVVisionAddon'
def loaderLabel = [forge: 'Forge', fabric: 'Fabric', neoforge: 'NeoForge'][target.loader]
base.archivesName = componentLabel
java { toolchain.languageVersion = JavaLanguageVersion.of(target.java as int); withSourcesJar() }
def generated = layout.buildDirectory.dir('generated/registered-sources')
def prepare = tasks.register('prepareSources', Sync) {
    into(generated)
    entries.each { entry ->
        from(rootProject.file("source/${entry.source}")) {
            into(new File(entry.path).parent)
            rename { new File(entry.path).name }
        }
    }
}
sourceSets {
    main { java.setSrcDirs([generated.map { it.dir('main/java') }]); resources.setSrcDirs([generated.map { it.dir('main/resources') }]) }
    test { java.setSrcDirs([generated.map { it.dir('test/java') }]); resources.setSrcDirs([]) }
}
tasks.withType(JavaCompile).configureEach { dependsOn(prepare); options.encoding = 'UTF-8'; options.release = target.java as int }
tasks.named('processResources') { dependsOn(prepare) }
tasks.named('sourcesJar') { dependsOn(prepare) }
def regressionTests = kind == 'addon' ? ['CpuTestPolicyTest', 'CpuPolicyTest', 'CpuOptionLeaseTest', 'CpuConfigurationTest', 'BridgeRegressionTest'] : ['NVVisionBoostIrisApiAdapterTest', 'NVVisionBoostRendererAdapterTest', 'NVVisionBoostMenuLayoutTest', 'NVVisionBoostOptionsPlacementTest', 'NVVisionBoostLanguageTest', 'NVVisionBoostIrisBridgeTest', 'NVVisionBoostGlAdapterTest', 'NVVisionBoostTargetLeaseTest', 'NVVisionBoostOpenGLSmokeTest']
regressionTests.each { testName ->
    def entry = entries.find { it.path.startsWith('test/java/') && it.path.endsWith("/${testName}.java") }
    if (entry) {
        def regression = tasks.register("regression${testName}", JavaExec) {
            group = 'verification'
            dependsOn(tasks.named('testClasses'))
            classpath = sourceSets.test.runtimeClasspath
            mainClass = entry.path.substring('test/java/'.length(), entry.path.length() - '.java'.length()).replace('/', '.')
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(target.java as int) }
            if (testName in ['CpuConfigurationTest', 'BridgeRegressionTest']) args(layout.buildDirectory.dir("regression/${testName}").get().asFile.absolutePath)
        }
        tasks.named('check') { dependsOn(regression) }
    }
}
tasks.withType(Jar).configureEach {
    dependsOn(prepare)
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest.attributes('Implementation-Title': 'NVVision', 'Implementation-Vendor': 'Cutjjen', 'Implementation-Version': project.version)
    archiveFileName = archiveClassifier.map { classifier ->
        "${componentLabel}-${target[kind]}-MC-${loaderLabel}-${target.minecraft}${classifier ? '-' + classifier : ''}.jar"
    }.orElse("${componentLabel}-${target[kind]}-MC-${loaderLabel}-${target.minecraft}.jar")
}
repositories { mavenCentral(); maven { url = 'https://api.modrinth.com/maven' } }
def id = kind == 'mod' ? 'nvvisionboost' : 'nvvisionvulkanbridge'
if (target.loader == 'neoforge' && target.adapterFamily != 'legacy-neoforge') {
    neoForge {
        enable { version = target.dependencies.platform; disableRecompilation = true }
        runs { client { client() } }
        mods { "${id}" { sourceSet(sourceSets.main) } }
    }
    tasks.withType(JavaCompile).configureEach { options.compilerArgs.add('-proc:none') }
    if (kind == 'mod') dependencies { compileOnly "maven.modrinth:iris:${target.dependencies.iris}" }
    dependencies { runtimeOnly "maven.modrinth:iris:${target.dependencies.iris}"; runtimeOnly "maven.modrinth:sodium:${target.dependencies.sodium}" }
} else if (target.loader == 'forge' || target.adapterFamily == 'legacy-neoforge') {
    legacyForge {
        enable {
            if (target.adapterFamily == 'legacy-neoforge') neoForgeVersion = target.dependencies.platform
            else forgeVersion = target.dependencies.platform
            disableRecompilation = true
        }
        runs { client { client() } }
        mods { "${id}" { sourceSet(sourceSets.main) } }
    }
    if (kind == 'mod') {
        dependencies { annotationProcessor 'org.spongepowered:mixin:0.8.5:processor' }
        mixin { add sourceSets.main, 'nvvisionboost.refmap.json'; config 'nvvisionboost.mixins.json' }
        tasks.named('jar') { manifest.attributes('MixinConfigs': 'nvvisionboost.mixins.json') }
    }
} else {
    dependencies {
        minecraft "com.mojang:minecraft:${target.minecraft}"
        if ((target.java as int) < 25) {
            mappings loom.officialMojangMappings()
            modImplementation "net.fabricmc:fabric-loader:${target.dependencies.platform}"
            if (kind == 'mod') modCompileOnly "maven.modrinth:iris:${target.dependencies.iris}"
            modRuntimeOnly "maven.modrinth:iris:${target.dependencies.iris}"
            modRuntimeOnly "maven.modrinth:sodium:${target.dependencies.sodium}"
        } else {
            implementation "net.fabricmc:fabric-loader:${target.dependencies.platform}"
            if (kind == 'mod') compileOnly "maven.modrinth:iris:${target.dependencies.iris}"
            runtimeOnly "maven.modrinth:iris:${target.dependencies.iris}"
            runtimeOnly "maven.modrinth:sodium:${target.dependencies.sodium}"
        }
    }
    if ((target.java as int) < 25) loom { clientOnlyMinecraftJar() }
}

// A declared Mixin config must be part of the archive; event-only addons need no header.
tasks.withType(Jar).configureEach {
    doLast {
        def archive = new java.util.jar.JarFile(archiveFile.get().asFile)
        try {
            def declared = archive.manifest?.mainAttributes?.getValue('MixinConfigs')
            declared?.split(',')?.each { name ->
                def entry = archive.getJarEntry(name.trim())
                if (entry == null) throw new GradleException('Missing declared Mixin resource: ' + name)
                new groovy.json.JsonSlurper().parse(archive.getInputStream(entry))
            }
        } finally {
            archive.close()
        }
    }
}

